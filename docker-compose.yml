services:
  # PostgreSQL：数据库只支持这一种，连接信息写在配置文件里（界面不再提供切换）
  postgres:
    image: postgres:16
    container_name: recall-postgres
    environment:
      POSTGRES_DB: recall
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall}
      # 中文内容排序/大小写行为更符合直觉
      LANG: C.UTF-8
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  recall:
    build:
      context: .
      args:
        # 想在容器里跑本地开源 ASR（faster-whisper）就设成 1
        INSTALL_LOCAL_ASR: ${INSTALL_LOCAL_ASR:-0}
    container_name: recall-workbench
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
    environment:
      # 生产环境请改成随机长字符串，并重新登录
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ASR_CONCURRENCY: ${ASR_CONCURRENCY:-2}
      # 数据库连接：默认连下面的 postgres 服务。
      # 想连已有的外部 PostgreSQL，就在项目根目录建一个 .env 写上（host.docker.internal 指向宿主机）
      #   DATABASE_URL=postgresql://用户:密码@host.docker.internal:5432/recall?sslmode=disable
      DATABASE_URL: ${DATABASE_URL:-postgresql://recall:${POSTGRES_PASSWORD:-recall}@postgres:5432/recall?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /app/server-py/.venv/bin/python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
